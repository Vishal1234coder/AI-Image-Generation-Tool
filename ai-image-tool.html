<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Image Generation Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        .btn-spinner {
            border-top-color: #ffffff;
            width: 20px;
            height: 20px;
            border-width: 2px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .enhance-btn.selected, .style-btn.selected {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px #3b82f6;
        }
        @keyframes zoom-in { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
        @keyframes pan-right { 0% { object-position: 0% 50%; } 100% { object-position: 100% 50%; } }
        @keyframes float-effect { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        .animate-zoom { animation: zoom-in 10s infinite alternate ease-in-out; }
        .animate-pan { animation: pan-right 10s infinite alternate ease-in-out; object-fit: cover; }
        .animate-float { animation: float-effect 6s infinite ease-in-out; }
        .toggle-checkbox:checked { right: 0; border-color: #4ade80; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4ade80; }
        
        #image-container { perspective: 1000px; }
        #generated-image { transition: transform 0.1s ease-out; }
        #history-gallery img { cursor: pointer; border: 2px solid transparent; transition: border-color 0.2s; }
        #history-gallery img:hover { border-color: #60a5fa; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <div class="max-w-2xl mx-auto bg-white dark:bg-gray-800 rounded-2xl shadow-lg overflow-hidden">
            <!-- Header -->
            <div class="p-6 bg-gradient-to-r from-blue-500 to-purple-600">
                <h1 class="text-2xl sm:text-3xl font-bold text-white text-center">AI Image Generation Tool</h1>
                <p class="text-sm text-blue-100 text-center mt-2">Powered by Gemini</p>
            </div>

            <!-- Input Section -->
            <div class="p-6">
                <div class="flex justify-between items-center mb-2">
                    <label for="prompt-input" class="block text-lg font-semibold text-gray-700 dark:text-gray-300">Enter or speak your description</label>
                    <div class="flex items-center space-x-2">
                        <span class="text-sm font-medium">Turbo Mode</span>
                        <div class="relative inline-block w-10 align-middle select-none">
                            <input type="checkbox" id="turbo-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                            <label for="turbo-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                        </div>
                    </div>
                </div>
                <div class="relative w-full">
                    <textarea id="prompt-input" rows="3" class="w-full p-3 pr-20 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g., A futuristic cityscape at sunset..."></textarea>
                    <div class="absolute top-1/2 right-3 -translate-y-1/2 flex gap-1">
                        <button id="prompt-history-btn" class="p-1.5 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600" title="Prompt History">
                            <svg class="w-5 h-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
                        </button>
                        <button id="mic-btn" class="p-1.5 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600" title="Use voice input"><svg id="mic-icon" class="w-5 h-5 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 016 0v8.25a3 3 0 01-3 3z" /></svg></button>
                    </div>
                    <div id="prompt-history-popup" class="hidden absolute right-0 mt-2 w-64 bg-white dark:bg-gray-700 rounded-lg shadow-lg z-10 p-2">
                        <!-- History items will be injected here -->
                    </div>
                </div>
                <textarea id="negative-prompt-input" rows="2" class="mt-2 w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Negative prompt (e.g., blurry, text, watermark)"></textarea>

                <div class="mt-4">
                    <label class="block text-md font-semibold mb-2">Style Palette</label>
                    <div id="style-palette" class="flex flex-wrap gap-2">
                        <button class="style-btn border-2 border-transparent rounded-lg p-2 text-sm bg-gray-200 dark:bg-gray-700" data-style="Cinematic">🎬 Cinematic</button>
                        <button class="style-btn border-2 border-transparent rounded-lg p-2 text-sm bg-gray-200 dark:bg-gray-700" data-style="Watercolor">🎨 Watercolor</button>
                        <button class="style-btn border-2 border-transparent rounded-lg p-2 text-sm bg-gray-200 dark:bg-gray-700" data-style="Cyberpunk">🤖 Cyberpunk</button>
                        <button class="style-btn border-2 border-transparent rounded-lg p-2 text-sm bg-gray-200 dark:bg-gray-700" data-style="Pixel Art">👾 Pixel Art</button>
                    </div>
                </div>

                <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <button id="surprise-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center"><span class="btn-text">🎉 Surprise Me!</span><div class="loader btn-spinner hidden"></div></button>
                    <button id="generate-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center"><svg class="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" /></svg>Generate Image</button>
                </div>
                
                <div class="mt-4">
                    <label for="visual-search-upload" class="block text-md font-semibold mb-2">Visual Search (Image-to-Prompt)</label>
                    <input type="file" id="visual-search-upload" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
                </div>
            </div>

            <!-- Output Section -->
            <div id="output-container" class="p-6 border-t border-gray-200 dark:border-gray-700">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold">Generated Image</h2>
                    <a id="download-btn" href="#" download="gemini-image.png" class="hidden p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700" title="Download Image"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg></a>
                </div>
                <div id="image-container" class="w-full aspect-square bg-gray-200 dark:bg-gray-700 rounded-lg flex items-center justify-center overflow-hidden">
                    <div id="loader" class="loader hidden"></div>
                    <img id="generated-image" src="https://placehold.co/512x512/e2e8f0/4a5568?text=Your+Image+Will+Appear+Here" alt="Generated AI Image" class="w-full h-full object-cover">
                </div>
                <div id="error-box" class="hidden mt-4 p-4 bg-red-100 dark:bg-red-900 border-red-400 rounded-lg"><p id="error-message"></p></div>
                
                <!-- Conversational Editing -->
                <div id="refine-container" class="hidden mt-4">
                    <label for="refine-input" class="block text-md font-semibold mb-2">Refine with a command</label>
                    <div class="flex gap-2">
                        <div class="relative w-full">
                            <input type="text" id="refine-input" class="w-full p-2 pr-10 border rounded-lg" placeholder="e.g., make it nighttime">
                            <button id="refine-mic-btn" class="absolute top-1/2 right-2 -translate-y-1/2 p-1.5 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600" title="Use voice for refinement">
                                <svg id="refine-mic-icon" class="w-5 h-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 016 0v8.25a3 3 0 01-3 3z" /></svg>
                            </button>
                        </div>
                        <button id="refine-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg flex items-center justify-center">
                            <span class="btn-text">Refine</span>
                            <div class="loader btn-spinner hidden"></div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Enhance Section -->
            <div id="enhance-container" class="p-6 border-t hidden"><label class="block text-lg font-semibold mb-2">Post-Generation Tools</label><div id="enhance-palette" class="flex flex-wrap gap-2"><button class="enhance-btn border-2 rounded-lg p-2 text-sm" data-action="zoom">🔎 Zoom</button><button class="enhance-btn border-2 rounded-lg p-2 text-sm" data-action="pan">↔️ Pan</button><button class="enhance-btn border-2 rounded-lg p-2 text-sm" data-action="float">☁️ Float</button><button class="enhance-btn border-2 rounded-lg p-2 text-sm" data-action="3d">🧊 Activate 3D View</button></div></div>
            
            <!-- History Section -->
            <div id="history-container" class="p-6 border-t hidden"><h3 class="text-lg font-semibold mb-4">Image History</h3><div id="history-gallery" class="grid grid-cols-4 sm:grid-cols-6 gap-2"></div></div>
        </div>
    </div>

    <script>
        const dom = {
            generateBtn: document.getElementById('generate-btn'),
            promptInput: document.getElementById('prompt-input'),
            negativePromptInput: document.getElementById('negative-prompt-input'),
            imageContainer: document.getElementById('image-container'),
            generatedImage: document.getElementById('generated-image'),
            loader: document.getElementById('loader'),
            errorBox: document.getElementById('error-box'),
            errorMessage: document.getElementById('error-message'),
            enhanceContainer: document.getElementById('enhance-container'),
            enhancePalette: document.getElementById('enhance-palette'),
            turboToggle: document.getElementById('turbo-toggle'),
            micBtn: document.getElementById('mic-btn'),
            micIcon: document.getElementById('mic-icon'),
            surpriseBtn: document.getElementById('surprise-btn'),
            visualSearchUpload: document.getElementById('visual-search-upload'),
            stylePalette: document.getElementById('style-palette'),
            historyContainer: document.getElementById('history-container'),
            historyGallery: document.getElementById('history-gallery'),
            downloadBtn: document.getElementById('download-btn'),
            refineContainer: document.getElementById('refine-container'),
            refineInput: document.getElementById('refine-input'),
            refineBtn: document.getElementById('refine-btn'),
            refineMicBtn: document.getElementById('refine-mic-btn'),
            refineMicIcon: document.getElementById('refine-mic-icon'),
            promptHistoryBtn: document.getElementById('prompt-history-btn'),
            promptHistoryPopup: document.getElementById('prompt-history-popup'),
        };

        const apiKey = ""; 
        const standardApiUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${apiKey}`;
        const turboApiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-preview-image-generation:generateContent?key=${apiKey}`;
        const textApiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

        let state = {
            currentAnimation: null,
            isRecognizing: false,
            is3dEffectActive: false,
            selectedStyle: null,
            imageHistory: [],
            promptHistory: [],
            lastBasePrompt: "",
            activeSpeechInput: null, // 'main' or 'refine'
        };
        let recognition;

        // --- Speech Recognition ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            
            dom.micBtn.addEventListener('click', () => {
                state.activeSpeechInput = 'main';
                if (state.isRecognizing) recognition.stop();
                else recognition.start();
            });
            dom.refineMicBtn.addEventListener('click', () => {
                state.activeSpeechInput = 'refine';
                if (state.isRecognizing) recognition.stop();
                else recognition.start();
            });

            recognition.onstart = () => {
                state.isRecognizing = true;
                if (state.activeSpeechInput === 'main') dom.micIcon.classList.add('text-red-500', 'animate-pulse');
                if (state.activeSpeechInput === 'refine') dom.refineMicIcon.classList.add('text-red-500', 'animate-pulse');
            };
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                if (state.activeSpeechInput === 'main') dom.promptInput.value = transcript;
                if (state.activeSpeechInput === 'refine') dom.refineInput.value = transcript;
            };
            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                showError(`Speech recognition error: ${event.error}.`);
            };
            recognition.onend = () => {
                state.isRecognizing = false;
                dom.micIcon.classList.remove('text-red-500', 'animate-pulse');
                if (dom.refineMicIcon) dom.refineMicIcon.classList.remove('text-red-500', 'animate-pulse');
            };
        } else {
            dom.micBtn.style.display = 'none';
            dom.refineMicBtn.style.display = 'none';
        }

        // --- Helpers ---
        const hideError = () => dom.errorBox.classList.add('hidden');
        const showError = (message) => { dom.errorMessage.textContent = message; dom.errorBox.classList.remove('hidden'); };
        const fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
        function toggleButtonLoading(button, isLoading) {
            const btnText = button.querySelector('.btn-text');
            const btnSpinner = button.querySelector('.loader');
            button.disabled = isLoading;
            if (btnText) btnText.classList.toggle('hidden', isLoading);
            if (btnSpinner) btnSpinner.classList.toggle('hidden', !isLoading);
        }

        function resetEnhancements() {
            if (state.currentAnimation) {
                dom.generatedImage.classList.remove(`animate-${state.currentAnimation}`);
                const btn = dom.enhancePalette.querySelector(`[data-action="${state.currentAnimation}"]`);
                if(btn) btn.classList.remove('selected');
                state.currentAnimation = null;
            }
            if (state.is3dEffectActive) {
                dom.imageContainer.removeEventListener('mousemove', handle3dMouseMove);
                dom.generatedImage.style.transform = 'rotateX(0deg) rotateY(0deg)';
                dom.enhancePalette.querySelector(`[data-action="3d"]`).classList.remove('selected');
                state.is3dEffectActive = false;
            }
            dom.enhanceContainer.classList.add('hidden');
            dom.refineContainer.classList.add('hidden');
        }

        async function callTextApi(prompt, imageBase64 = null, mimeType = null) {
            let parts = [{ text: prompt }];
            if (imageBase64 && mimeType) {
                parts.push({ inlineData: { mimeType, data: imageBase64 } });
            }
            const payload = { contents: [{ parts }] };
            const response = await fetch(textApiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(`Text API Error: ${errorData?.error?.message}`);
            }
            const result = await response.json();
            return result.candidates[0].content.parts[0].text;
        }

        // --- Core Image Generation ---
        async function generateImage(prompt, negativePrompt) {
            dom.loader.classList.remove('hidden');
            dom.generatedImage.classList.add('hidden');
            dom.generateBtn.disabled = true;
            hideError();
            resetEnhancements();

            state.lastBasePrompt = prompt;
            updatePromptHistory(prompt);

            let finalPrompt = prompt;
            if (state.selectedStyle) {
                finalPrompt = `${prompt}, ${state.selectedStyle} style`;
            }

            const isTurbo = dom.turboToggle.checked;
            const apiUrl = isTurbo ? turboApiUrl : standardApiUrl;
            
            let payload;
            if (isTurbo) {
                payload = { contents: [{ parts: [{ text: finalPrompt }] }], generationConfig: { responseModalities: ['IMAGE'] } };
            } else {
                payload = { instances: [{ prompt: finalPrompt, negative_prompt: negativePrompt }], parameters: { "sampleCount": 1 } };
            }

            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`API request failed: ${errorData?.error?.message || 'Unknown error'}`);
                }
                const result = await response.json();
                let base64Data = isTurbo ? result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data : result?.predictions?.[0]?.bytesBase64Encoded;

                if (base64Data) {
                    const imageUrl = `data:image/png;base64,${base64Data}`;
                    dom.generatedImage.src = imageUrl;
                    dom.downloadBtn.href = imageUrl;
                    dom.downloadBtn.classList.remove('hidden');
                    dom.generatedImage.classList.remove('hidden');
                    dom.enhanceContainer.classList.remove('hidden');
                    dom.refineContainer.classList.remove('hidden');
                    updateImageHistory(imageUrl, prompt);
                } else {
                    throw new Error('Invalid response structure from the API.');
                }
            } catch (error) {
                console.error("Generation error:", error);
                showError(error.message);
            } finally {
                dom.loader.classList.add('hidden');
                dom.generateBtn.disabled = false;
            }
        }
        
        // --- History ---
        function updateImageHistory(imageUrl, prompt) {
            state.imageHistory.unshift({ src: imageUrl, prompt: prompt });
            if (state.imageHistory.length > 12) state.imageHistory.pop();
            dom.historyGallery.innerHTML = '';
            dom.historyContainer.classList.remove('hidden');
            state.imageHistory.forEach(item => {
                const img = document.createElement('img');
                img.src = item.src;
                img.title = item.prompt;
                img.className = "w-full h-full object-cover rounded-md";
                img.onclick = () => {
                    dom.promptInput.value = item.prompt;
                    dom.generatedImage.src = item.src;
                    dom.downloadBtn.href = item.src;
                    dom.downloadBtn.classList.remove('hidden');
                    resetEnhancements();
                    dom.enhanceContainer.classList.remove('hidden');
                    dom.refineContainer.classList.remove('hidden');
                    state.lastBasePrompt = item.prompt;
                };
                dom.historyGallery.appendChild(img);
            });
        }

        function updatePromptHistory(prompt) {
            if (!state.promptHistory.includes(prompt)) {
                state.promptHistory.unshift(prompt);
                if (state.promptHistory.length > 10) state.promptHistory.pop();
            }
            renderPromptHistory();
        }

        function renderPromptHistory() {
            dom.promptHistoryPopup.innerHTML = '';
            if (state.promptHistory.length === 0) {
                dom.promptHistoryPopup.innerHTML = `<p class="text-xs text-gray-400 p-2">No recent prompts.</p>`;
                return;
            }
            state.promptHistory.forEach(prompt => {
                const item = document.createElement('div');
                item.textContent = prompt;
                item.className = "p-2 hover:bg-gray-100 dark:hover:bg-gray-600 cursor-pointer text-sm truncate";
                item.onclick = () => {
                    dom.promptInput.value = prompt;
                    dom.promptHistoryPopup.classList.add('hidden');
                };
                dom.promptHistoryPopup.appendChild(item);
            });
        }

        // --- 3D Effect ---
        function handle3dMouseMove(e) {
            const { width, height, left, top } = dom.imageContainer.getBoundingClientRect();
            const x = e.clientX - left; const y = e.clientY - top;
            const rotateY = ((x - width / 2) / (width / 2)) * 10;
            const rotateX = -((y - height / 2) / (height / 2)) * 10;
            dom.generatedImage.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        }

        // --- Event Listeners ---
        dom.generateBtn.addEventListener('click', () => {
            const prompt = dom.promptInput.value.trim();
            if (prompt) generateImage(prompt, dom.negativePromptInput.value.trim());
            else showError('Please enter a prompt.');
        });
        
        dom.refineBtn.addEventListener('click', () => {
            const refineText = dom.refineInput.value.trim();
            if (!refineText) { showError("Please enter a refinement command."); return; }
            const newPrompt = `${state.lastBasePrompt}, ${refineText}`;
            dom.promptInput.value = newPrompt;
            generateImage(newPrompt, dom.negativePromptInput.value.trim());
            dom.refineInput.value = "";
        });

        dom.surpriseBtn.addEventListener('click', async () => {
            const btn = dom.surpriseBtn;
            toggleButtonLoading(btn, true);
            try {
                const prompt = await callTextApi("Suggest a creative and visually stunning prompt for an AI image generator.");
                dom.promptInput.value = prompt.trim();
                generateImage(prompt.trim(), dom.negativePromptInput.value.trim());
            } catch (error) {
                showError("Could not get a surprise prompt.");
            } finally {
                toggleButtonLoading(btn, false);
            }
        });

        dom.visualSearchUpload.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            try {
                const base64 = await fileToBase64(file);
                const description = await callTextApi("Describe this image for an AI image generator.", base64, file.type);
                dom.promptInput.value = description.trim();
            } catch (error) {
                showError("Could not analyze the image.");
            }
        });

        dom.stylePalette.addEventListener('click', (event) => {
            const button = event.target.closest('.style-btn');
            if (!button) return;
            dom.stylePalette.querySelectorAll('.style-btn').forEach(btn => btn.classList.remove('selected'));
            if (state.selectedStyle === button.dataset.style) {
                state.selectedStyle = null;
            } else {
                state.selectedStyle = button.dataset.style;
                button.classList.add('selected');
            }
        });

        dom.enhancePalette.addEventListener('click', (event) => {
            const button = event.target.closest('.enhance-btn');
            if (!button) return;
            const action = button.dataset.action;

            if (state.is3dEffectActive) {
                dom.imageContainer.removeEventListener('mousemove', handle3dMouseMove);
                dom.generatedImage.style.transform = 'rotateX(0deg) rotateY(0deg)';
                dom.enhancePalette.querySelector(`[data-action="3d"]`).classList.remove('selected');
                state.is3dEffectActive = false;
            }
            if (action === '3d') {
                state.is3dEffectActive = !state.is3dEffectActive;
                if (state.is3dEffectActive) {
                    if (state.currentAnimation) {
                        dom.generatedImage.classList.remove(`animate-${state.currentAnimation}`);
                        dom.enhancePalette.querySelector(`[data-action="${state.currentAnimation}"]`).classList.remove('selected');
                        state.currentAnimation = null;
                    }
                    button.classList.add('selected');
                    dom.imageContainer.addEventListener('mousemove', handle3dMouseMove);
                }
                return;
            }
            
            if (state.currentAnimation) {
                dom.generatedImage.classList.remove(`animate-${state.currentAnimation}`);
                dom.enhancePalette.querySelector(`[data-action="${state.currentAnimation}"]`).classList.remove('selected');
            }
            if (state.currentAnimation !== action) {
                dom.generatedImage.classList.add(`animate-${action}`);
                button.classList.add('selected');
                state.currentAnimation = action;
            } else {
                state.currentAnimation = null;
            }
        });
        
        dom.promptHistoryBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dom.promptHistoryPopup.classList.toggle('hidden');
        });
        
        document.addEventListener('click', (e) => {
            if (!dom.promptHistoryPopup.contains(e.target) && e.target !== dom.promptHistoryBtn) {
                dom.promptHistoryPopup.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
